[tool.ruff]
line-length = 100
target-version = "py310"
# The flat modules at the repo root are the older experimental pipeline that the
# deployed app does not use. They are linted separately once they are cleaned up.
include = ["app.py", "linkphobot/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"app.py" = [
    "S104",  # binding 0.0.0.0 is required on Hugging Face Spaces
    "E501",  # inline CSS/HTML strings
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
